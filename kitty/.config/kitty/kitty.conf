#
# Configuration
font_family                 CaskaydiaCove Nerd Font
font_size                   10
bold_font                   auto
italic_font                 auto
bold_italic_font            auto
remember_window_size        yes
initial_window_width        950
initial_window_height       500
cursor_blink_interval       0.5
cursor_stop_blinking_after  1
scrollback_lines            2000
wheel_scroll_min_lines      1
enable_audio_bell           no
window_padding_width        10
hide_window_decorations     yes
background_opacity          0.8
dynamic_background_opacity  yes
confirm_os_window_close     0
# selection_foreground        none
# selection_background        none

# Animated cursor follows text
include $HOME/.config/ml4w/settings/kitty-cursor-trail.conf

# Include wallpaper colors
include colors-matugen.conf

# Include Custom Configuration
# Create the file custom.conf in ~/.config/kitty to overwrite the default configuration
include $HOME/.config/kitty/custom.conf



# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

bidi_symbol_icubp auto
font_family      JetBrainsMono Nerd Font
symbol_map U+0600-U+06FF Noto Sans Arabic

map ctrl+shift+a>m set_background_opacity +0.1
map ctrl+shift+a>l set_background_opacity -0.1
map ctrl+shift+a>1 set_background_opacity 1
map ctrl+shift+a>d set_background_opacity default

map ctrl+equal  change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0

mouse_hide_wait 3.0

map ctrl+shift+e open_url_with_hints

# --- Keybindings & General Settings ---
unbind r
bind r source-file ~/.tmux.conf

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-256color:sixel"

set -g prefix C-x

bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

set -g mouse on
set-window-option -g mode-keys vi

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key x kill-pane

# --- UI & Status Bar ---
set-option -g status-position top
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application} #{E:@catppuccin_status_session}"

# set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# --- Plugin Configurations (Must be before TPM) ---
set -g @sessionx-bind 'o'
set -g @floax-bind 'M-f'

# --- Floax Custom Shortcut (Alt+f) ---
bind -n M-f run-shell '~/.tmux/plugins/tmux-floax/scripts/floax.sh'

# --- Plugins List ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.1.0'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/tmux-sessionx'

# Continuum settings
set -g @continuum-restore 'on'


# --- Initialize TPM (MUST BE AT THE VERY BOTTOM) ---
run '~/.tmux/plugins/tpm/tpm'

# --- Override Bindings (Must be AFTER TPM) ---
bind p previous-window

set -g status-style bg=default

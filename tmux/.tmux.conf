unbind r
bind r source-file ~/.tmux.conf

# إعدادات الألوان وإظهار الصور لـ WezTerm
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-256color:sixel"

# تفعيل مرور بروتوكولات الصور عبر tmux
set -g allow-passthrough on
set -s extended-keys on

# إجبار tmux على الالتزام ببيئة WezTerm
set -ga update-environment "TERM_PROGRAM"
set -ga update-environment "WEZTERM_PANE"
set -ga update-environment "WEZTERM_EXECUTABLE"

set -g prefix C-x

bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

set -g mouse on

set-window-option -g mode-keys vi

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-option -g status-position top

# set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.1.0'

set -g @plugin 'sainnhe/tmux-fzf'          # إضافة البحث السريع fzf
set -g @plugin 'tmux-plugins/tmux-resurrect' # إضافة حفظ الجلسات
# تم تعطيل الحفظ التلقائي مؤقتاً لتجنب إعادة الجلسة الخاطئة القديمة
# set -g @plugin 'tmux-plugins/tmux-continuum'

set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application} #{E:@catppuccin_status_session}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

set -g status-style bg=default

$ml4w_cache_folder = $HOME/.cache/ml4w/hyprland-dotfiles

# BACKGROUND
background {
    monitor =
    path = $ml4w_cache_folder/blurred_wallpaper.png
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# Day
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A")"
    color = rgba(216, 222, 233, 0.85)
    font_size = 55
    font_family = SF Pro Display Bold
    position = 0, 320
    halign = center
    valign = center
}

# Date-Month
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%d %B")"
    color = rgba(216, 222, 233, 0.75)
    font_size = 24
    font_family = SF Pro Display Bold
    position = 0, 250
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M %p")</span>"
    color = rgba(216, 222, 233, 0.85)
    font_size = 18
    font_family = SF Pro Display Bold
    position = 0, 210
    halign = center
    valign = center
}

# Profile-Photo
image {
    monitor =
    path = /home/zaid/Pictures/Zaid/zaid-small.png
    border_size = 2
    border_color = rgba(255, 255, 255, .65)
    size = 110
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, 80
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =    $USER
    color = rgba(216, 222, 233, 0.80)
    font_size = 16
    font_family = SF Pro Display Bold
    position = 0, -20
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = SF Pro Display Bold
    placeholder_text = <i><span foreground="##ffffff99">Enter Pass</span></i>
    hide_input = false
    position = 0, -90
    halign = center
    valign = center
}

# Keyboard Layout
label {
    monitor =
    text = cmd[update:100] hyprctl devices -j | jq -r '.keyboards[] | select(.main == true) | .active_keymap' | awk '{print toupper(substr($0,1,2))}'
    color = rgba(216, 222, 233, 0.60)
    font_size = 14
    font_family = SF Pro Display Bold
    position = 180, -90
    halign = center
    valign = center
}
